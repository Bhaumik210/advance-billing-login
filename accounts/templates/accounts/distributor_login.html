<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributor Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
        }

        .brand {
            text-align: center;
            margin-bottom: 22px;
        }

        .brand h1 {
            font-size: 28px;
            color: #1f2937;
            margin-bottom: 6px;
        }

        .brand p {
            color: #6b7280;
            font-size: 14px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #e5e7eb;
        }

        .login-header {
            margin-bottom: 25px;
        }

        .login-header h2 {
            font-size: 24px;
            color: #111827;
            margin-bottom: 6px;
        }

        .login-header p {
            font-size: 14px;
            color: #6b7280;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.2s ease;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
        }

        .login-btn {
            width: 100%;
            border: none;
            background: #2563eb;
            color: #ffffff;
            padding: 13px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .error-message {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .switch-section {
            margin-top: 22px;
            text-align: center;
            font-size: 14px;
            color: #6b7280;
        }

        .switch-section a {
            color: #1f2937;
            font-weight: 600;
            text-decoration: none;
        }

        .switch-section a:hover {
            text-decoration: underline;
        }

        .footer-text {
            text-align: center;
            margin-top: 18px;
            font-size: 12px;
            color: #9ca3af;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 24px;
            }

            .brand h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="login-wrapper">

    <div class="brand">
        <h1>Advance Billing System</h1>
        <p>Secure Billing & QR Management Portal</p>
    </div>

    <div class="login-card">

        <div class="login-header">
            <h2>Distributor Login</h2>
            <p>Sign in to access your distributor account.</p>
        </div>

        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter distributor username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                Sign In as Distributor
            </button>
        </form>

        <div class="switch-section">
            Administrator?
            <a href="{% url 'admin_login' %}">
                Admin Login
            </a>
        </div>

    </div>

    <div class="footer-text">
        Advance Billing System with QR
    </div>

</div>

</body>
</html>
