<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Customer</title>

    <style>
:root {
    --emerald: #047857;
    --emerald-dark: #065f46;
    --text: #17352a;
    --muted: #718078;
    --border: #e2ebe5;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #f1f8f3, #f8faf9);
    min-height: 100vh;
    color: var(--text);
}

.navbar {
    min-height: 72px;
    background: #fff;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8%;
    box-shadow: 0 3px 15px rgba(16, 75, 48, .04);
}

.navbar h2 {
    font-size: 21px;
    font-weight: 750;
    color: var(--emerald-dark);
}

.navbar span {
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
}

.container {
    width: 92%;
    max-width: 850px;
    margin: 48px auto;
}

.page-header {
    margin-bottom: 25px;
}

.page-header h1 {
    font-size: 30px;
    letter-spacing: -.7px;
    margin: 0 0 8px;
    color: #123b2b;
}

.page-header p {
    color: var(--muted);
    font-size: 14px;
}

.form-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 36px;
    box-shadow: 0 12px 35px rgba(18, 59, 43, .07);
}

.success-message {
    background: #ecfdf5;
    color: #065f46;
    border: 1px solid #b8e5ce;
    padding: 14px 16px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-size: 14px;
}

.error-message {
    background: #fff1f0;
    color: #b42318;
    border: 1px solid #f5c8c5;
    padding: 14px 16px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-size: 14px;
}

.form-card form {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 4px 22px;
}

.form-group {
    margin-bottom: 18px;
    min-width: 0;
}

.form-group:nth-of-type(4) {
    grid-column: 1 / -1;
}

label {
    display: block;
    margin-bottom: 9px;
    font-size: 13px;
    font-weight: 700;
    color: #304c3e;
}

input,
textarea {
    width: 100%;
    padding: 14px 15px;
    border: 1px solid #dce7e0;
    border-radius: 10px;
    background: #fff;
    color: #20392d;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
}

input::placeholder,
textarea::placeholder {
    color: #a0aca5;
}

input:focus,
textarea:focus {
    border-color: var(--emerald);
    box-shadow: 0 0 0 4px rgba(4, 120, 87, .09);
}

textarea {
    min-height: 120px;
    resize: vertical;
    line-height: 1.6;
}

.submit-btn {
    grid-column: 1 / -1;
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: var(--emerald);
    color: #fff;
    font-size: 15px;
    font-weight: 750;
    cursor: pointer;
    transition: .2s ease;
}

.submit-btn:hover {
    background: var(--emerald-dark);
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(4, 120, 87, .18);
}

.submit-btn:active {
    transform: translateY(0);
}

.footer {
    text-align: center;
    margin-top: 25px;
    color: #98a89e;
    font-size: 12px;
}

@media (max-width: 600px) {
    .navbar {
        padding: 0 5%;
        min-height: 64px;
    }

    .navbar h2 {
        font-size: 17px;
    }

    .navbar span {
        font-size: 11px;
    }

    .container {
        width: 92%;
        margin: 30px auto;
    }

    .page-header h1 {
        font-size: 25px;
    }

    .form-card {
        padding: 24px 19px;
    }

    .form-card form {
        grid-template-columns: 1fr;
        gap: 0;
    }

    .form-group:nth-of-type(4),
    .submit-btn {
        grid-column: 1;
    }
}
</style>
</head>

<body>

<nav class="navbar">

    <h2>Advance Billing System</h2>

    <span>
        Customer Management
    </span>

</nav>

<div class="container">

    <div class="page-header">

        <h1>Add New Customer</h1>

        <p>
            Enter customer information below.
        </p>

    </div>

    <div class="form-card">

        {% if success %}

            <div class="success-message">
                {{ success }}
            </div>

        {% endif %}

        {% if error %}

            <div class="error-message">
                {{ error }}
            </div>

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label for="name">
                    Customer Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ form_data.name }}"
                    placeholder="Enter customer name"
                    minlength="2"
                    required
                >

            </div>

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ form_data.email }}"
                    placeholder="Enter email address"
                    required
                >

            </div>

            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    value="{{ form_data.phone }}"
                    placeholder="Enter 10-digit phone number"
                    minlength="10"
                    maxlength="10"
                    pattern="[0-9]{10}"
                    inputmode="numeric"
                    required
                >

            </div>

            <div class="form-group">

                <label for="address">
                    Address
                </label>

                <textarea
                    id="address"
                    name="address"
                    placeholder="Enter customer address"
                    required
                >{{ form_data.address }}</textarea>

            </div>

            <button
                type="submit"
                class="submit-btn"
            >
                Add Customer
            </button>

        </form>

    </div>

    <div class="footer">
        Advance Billing System with QR
    </div>

</div>

</body>
</html>
