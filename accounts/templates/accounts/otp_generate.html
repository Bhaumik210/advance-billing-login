<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Generate OTP</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .wrapper {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 22px;
        }

        .brand h1 {
            color: #1f2937;
            font-size: 28px;
            margin-bottom: 6px;
        }

        .brand p {
            color: #6b7280;
            font-size: 14px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 32px;
            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            font-size: 24px;
            color: #111827;
            margin-bottom: 6px;
        }

        .description {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #374151;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.08);
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            padding: 11px 12px;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #047857;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .verify-link {
            text-align: center;
            margin-top: 22px;
            color: #6b7280;
            font-size: 14px;
        }

        .verify-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .footer {
            text-align: center;
            margin-top: 18px;
            color: #9ca3af;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="wrapper">

    <div class="brand">
        <h1>Advance Billing System</h1>

        <p>
            Secure Billing & QR Management Portal
        </p>
    </div>

    <div class="card">

        <h2>Generate OTP</h2>

        <p class="description">
            Enter your email address to generate
            a 6-digit verification code.
        </p>

        {% if message %}
            <div class="message">
                {{ message }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter email address"
                    required
                >

            </div>

            <button type="submit">
                Generate OTP
            </button>

        </form>

        <div class="verify-link">

            Already generated an OTP?

            <a href="{% url 'verify_otp' %}">
                Verify OTP
            </a>

        </div>

    </div>

    <div class="footer">
        Advance Billing System with QR
    </div>

</div>

</body>

</html>
