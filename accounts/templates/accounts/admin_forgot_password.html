<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Admin Password</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif; background: #f4f7fb;
            min-height: 100vh; display: flex; align-items: center;
            justify-content: center; padding: 20px;
        }
        .wrapper { width: 100%; max-width: 430px; }
        .card {
            background: white; border: 1px solid #e5e7eb;
            border-radius: 14px; padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }
        h1 { color: #1f2937; font-size: 25px; margin-bottom: 8px; }
        p { color: #6b7280; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
        .group { margin-bottom: 16px; }
        label { display: block; color: #374151; font-size: 14px; font-weight: 600; margin-bottom: 7px; }
        input {
            width: 100%; padding: 12px; border: 1px solid #d1d5db;
            border-radius: 8px; font-size: 15px;
        }
        .otp { text-align: center; letter-spacing: 6px; font-size: 20px; }
        button {
            width: 100%; padding: 13px; border: 0; border-radius: 8px;
            background: #1f2937; color: white; font-size: 15px;
            font-weight: 600; cursor: pointer;
        }
        .error, .success { padding: 11px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
        .error { color: #b91c1c; background: #fef2f2; }
        .success { color: #047857; background: #ecfdf5; }
        .links { text-align: center; margin-top: 18px; font-size: 14px; }
        a { color: #2563eb; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="card">
        <h1>Reset Admin Password</h1>
        <p>Enter the OTP sent to your registered Admin email and choose a new password. OTP expires after 5 minutes.</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        {% if message %}<div class="success">{{ message }}</div>{% endif %}
        <form method="POST">
            {% csrf_token %}
            <div class="group">
                <label for="email">Registered Admin Email</label>
                <input type="email" id="email" name="email" value="{{ email }}" required>
            </div>
            <div class="group">
                <label for="otp">6-Digit OTP</label>
                <input class="otp" type="text" id="otp" name="otp" maxlength="6"
                       pattern="[0-9]{6}" inputmode="numeric" placeholder="000000" required>
            </div>
            <div class="group">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password"
                       autocomplete="new-password" required>
            </div>
            <div class="group">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password"
                       autocomplete="new-password" required>
            </div>
            <button type="submit">Verify OTP &amp; Reset Password</button>
        </form>
        <div class="links">
            <a href="{% url 'admin_generate_otp' %}">Generate / Resend OTP</a>
        </div>
        <div class="links">
            <a href="{% url 'admin_login' %}">Back to Admin Login</a>
        </div>
    </div>
</div>
</body>
</html>
