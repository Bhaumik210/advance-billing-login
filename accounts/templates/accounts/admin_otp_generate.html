<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Password Recovery</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .wrapper { width: 100%; max-width: 430px; }
        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }
        h1 { color: #1f2937; font-size: 25px; margin-bottom: 8px; }
        p { color: #6b7280; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
        label { display: block; margin-bottom: 7px; font-size: 14px; font-weight: 600; }
        input {
            width: 100%; padding: 12px; border: 1px solid #d1d5db;
            border-radius: 8px; font-size: 15px; margin-bottom: 18px;
        }
        button {
            width: 100%; padding: 13px; border: 0; border-radius: 8px;
            background: #1f2937; color: white; font-size: 15px;
            font-weight: 600; cursor: pointer;
        }
        .message, .error { padding: 11px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
        .message { color: #047857; background: #ecfdf5; }
        .error { color: #b91c1c; background: #fef2f2; }
        .links { text-align: center; margin-top: 18px; font-size: 14px; }
        a { color: #2563eb; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="card">
        <h1>Admin Password Recovery</h1>
        <p>Enter your registered Admin email address. A 6-digit OTP will be sent if the email belongs to an Admin account.</p>
        {% if message %}<div class="message">{{ message }}</div>{% endif %}
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST">
            {% csrf_token %}
            <label for="email">Registered Admin Email</label>
            <input type="email" id="email" name="email" placeholder="Enter Admin email" required>
            <button type="submit">Generate Admin OTP</button>
        </form>
        <div class="links">
            <a href="{% url 'admin_forgot_password' %}">Continue to Reset Password</a>
        </div>
        <div class="links">
            <a href="{% url 'admin_login' %}">Back to Admin Login</a>
        </div>
    </div>
</div>
</body>
</html>
