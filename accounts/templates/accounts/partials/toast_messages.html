{% if messages %}
<div class="toast-container" id="toastContainer">
    {% for message in messages %}
    <div class="toast-message toast-{{ message.level_tag|default:'info' }}"
         role="{% if 'error' in message.level_tag %}alert{% else %}status{% endif %}">
        <span class="toast-icon">
            {% if 'success' in message.level_tag %}✓
            {% elif 'error' in message.level_tag %}✕
            {% elif 'warning' in message.level_tag %}⚠
            {% else %}ℹ{% endif %}
        </span>
        <span class="toast-text">{{ message }}</span>
        <button type="button" class="toast-close" aria-label="Close notification">&times;</button>
    </div>
    {% endfor %}
</div>
{% endif %}

<style>
.toast-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: min(380px, calc(100vw - 30px));
}
.toast-message {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 15px 16px;
    border-radius: 10px;
    background: #fff;
    box-shadow: 0 5px 22px rgba(0,0,0,.16);
    border-left: 5px solid #64748b;
    color: #222;
    font-size: 14px;
    animation: toastSlideIn .3s ease;
    transition: opacity .3s, transform .3s;
}
.toast-success { border-left-color: #16a34a; }
.toast-error { border-left-color: #dc2626; }
.toast-warning { border-left-color: #d97706; }
.toast-info { border-left-color: #2563eb; }
.toast-icon { font-size: 20px; font-weight: bold; }
.toast-success .toast-icon { color: #16a34a; }
.toast-error .toast-icon { color: #dc2626; }
.toast-warning .toast-icon { color: #d97706; }
.toast-info .toast-icon { color: #2563eb; }
.toast-text { flex: 1; line-height: 1.5; }
.toast-close {
    border: 0;
    background: transparent;
    color: #777;
    font-size: 22px;
    cursor: pointer;
}
.toast-hide {
    opacity: 0;
    transform: translateX(30px);
}
@keyframes toastSlideIn {
    from { opacity: 0; transform: translateX(30px); }
    to { opacity: 1; transform: translateX(0); }
}
@media (max-width: 480px) {
    .toast-container { top: 10px; right: 10px; }
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll(".toast-message").forEach(function (toast) {
        const closeButton = toast.querySelector(".toast-close");

        function closeToast() {
            toast.classList.add("toast-hide");
            setTimeout(function () {
                toast.remove();
            }, 300);
        }

        if (closeButton) {
            closeButton.addEventListener("click", closeToast);
        }

        setTimeout(closeToast, 5000);
    });
});
</script>
