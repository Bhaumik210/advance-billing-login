<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .wrapper {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 22px;
        }

        .brand h1 {
            color: #1f2937;
            font-size: 28px;
            margin-bottom: 6px;
        }

        .brand p {
            color: #6b7280;
            font-size: 14px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            font-size: 24px;
            color: #111827;
            margin-bottom: 6px;
        }

        .description {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        label {
            display: block;
            color: #374151;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            text-align: center;
            font-size: 20px;
            letter-spacing: 6px;
            margin-bottom: 18px;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .success {
            background: #ecfdf5;
            color: #047857;
            padding: 11px;
            border-radius: 8px;
            margin-bottom: 18px;
        }

        .error {
            background: #fef2f2;
            color: #b91c1c;
            padding: 11px;
            border-radius: 8px;
            margin-bottom: 18px;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="wrapper">

    <div class="brand">
        <h1>Advance Billing System</h1>
        <p>Secure Billing & QR Management Portal</p>
    </div>

    <div class="card">

        <h2>Verify OTP</h2>

        <p class="description">
            Enter the 6-digit OTP generated for your email address.
        </p>

        {% if message %}
            <div class="success">
                {{ message }}
            </div>
        {% endif %}

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <label for="otp">OTP Code</label>

            <input
                type="text"
                id="otp"
                name="otp"
                maxlength="6"
                pattern="[0-9]{6}"
                placeholder="000000"
                inputmode="numeric"
                required
            >

            <button type="submit">
                Verify OTP
            </button>

        </form>

        <div class="back-link">
            <a href="{% url 'generate_otp' %}">
                Generate New OTP
            </a>
        </div>

    </div>

</div>

</body>
</html>
