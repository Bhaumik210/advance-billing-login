<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributor Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .register-wrapper {
            width: 100%;
            max-width: 480px;
        }

        .brand {
            text-align: center;
            margin-bottom: 22px;
        }

        .brand h1 {
            font-size: 28px;
            color: #1f2937;
            margin-bottom: 6px;
        }

        .brand p {
            font-size: 14px;
            color: #6b7280;
        }

        .register-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .register-header {
            margin-bottom: 25px;
        }

        .register-header h2 {
            font-size: 24px;
            color: #111827;
            margin-bottom: 6px;
        }

        .register-header p {
            font-size: 14px;
            color: #6b7280;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.2s ease;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
        }

        .register-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .register-btn:hover {
            background: #1d4ed8;
        }

        .login-link {
            margin-top: 22px;
            text-align: center;
            font-size: 14px;
            color: #6b7280;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .footer-text {
            text-align: center;
            margin-top: 18px;
            color: #9ca3af;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            .register-card {
                padding: 24px;
            }

            .brand h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="register-wrapper">

    <div class="brand">
        <h1>Advance Billing System</h1>
        <p>Secure Billing & QR Management Portal</p>
    </div>

    <div class="register-card">

        <div class="register-header">
            <h2>Distributor Registration</h2>
            <p>Create your distributor account to access the billing system.</p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter email address"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter phone number"
                    maxlength="10"
                    pattern="[0-9]{10}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create password"
                    required
                >
            </div>

            <button type="submit" class="register-btn">
                Register Distributor
            </button>

        </form>

        <div class="login-link">
            Already registered?
            <a href="{% url 'distributor_login' %}">
                Distributor Login
            </a>
        </div>

    </div>

    <div class="footer-text">
        Advance Billing System with QR
    </div>

</div>

</body>
</html>
