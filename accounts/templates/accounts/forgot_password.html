<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .wrapper {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 22px;
        }

        .brand h1 {
            font-size: 28px;
            color: #1f2937;
            margin-bottom: 6px;
        }

        .brand p {
            color: #6b7280;
            font-size: 14px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 32px;
            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            font-size: 24px;
            color: #111827;
            margin-bottom: 7px;
        }

        .description {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.08);
        }

        .otp-input {
            text-align: center;
            font-size: 20px;
            letter-spacing: 6px;
        }

        .verify-btn {
            width: 100%;
            border: none;
            padding: 13px;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .verify-btn:hover {
            background: #1d4ed8;
        }

        .resend {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #6b7280;
        }

        .resend a {
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
        }

        .resend a:hover {
            text-decoration: underline;
        }

        .back-login {
            text-align: center;
            margin-top: 18px;
        }

        .back-login a {
            color: #374151;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        .back-login a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 18px;
            color: #9ca3af;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 24px;
            }

            .brand h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="wrapper">

    <div class="brand">

        <h1>Advance Billing System</h1>

        <p>
            Secure Billing & QR Management Portal
        </p>

    </div>

    <div class="card">

        <h2>Forgot Password</h2>

        <p class="description">
            Enter your email address and the OTP
            sent for password verification.
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter registered email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="otp">
                    OTP Code
                </label>

                <input
                    class="otp-input"
                    type="text"
                    id="otp"
                    name="otp"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    inputmode="numeric"
                    placeholder="000000"
                    required
                >

            </div>

            <button
                type="submit"
                class="verify-btn"
            >
                Verify OTP
            </button>

        </form>

        <div class="resend">

            Didn't receive the OTP?

            <a href="{% url 'generate_otp' %}">
                Resend OTP
            </a>

        </div>

        <div class="back-login">

            <a href="{% url 'distributor_login' %}">
                Back to Login
            </a>

        </div>

    </div>

    <div class="footer">
        Advance Billing System with QR
    </div>

</div>

</body>

</html>
